<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d0d0d">
<title>Petzi Fresh</title>
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="app">
<header class="hero">
<img class="logo" src="IMG_1913.jpeg" alt="Petzi Fresh">
<div><b>PETZI FRESH</b><small>Bienvenue dans votre espace</small></div>
</header>
<main>
<h1>Petzi Fresh</h1><p class="intro">Découvrez nos produits et nos liens.</p>
<div class="search"><span>⌕</span><input id="search" placeholder="Rechercher un produit..."></div>
<section id="products" class="grid"></section>
<section id="links" class="links hidden">
<a href="https://t.me/" target="_blank">✈️ <b>Canal Telegram</b><span>›</span></a>
<a href="https://t.me/" target="_blank">💬 <b>Contact</b><span>›</span></a>
</section>
</main>
<nav>
<button class="active" data-tab="products">🛍️<small>PRODUITS</small></button>
<button data-tab="links">🔗<small>LINKS</small></button>
</nav>
</div>
<script src="app.js"></script>
</body>
</html>
